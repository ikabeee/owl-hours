# Subflow: open a deep link in the running app. Every screen builds its demo
# data on mount, so each flow starts from the seed without restarting Expo Go.
appId: host.exp.Exponent
---
- launchApp:
    stopApp: false
- openLink: "exp://127.0.0.1:8081/--/${ROUTE}"
- extendedWaitUntil:
    visible: ${WAIT_FOR}
    timeout: 60000
