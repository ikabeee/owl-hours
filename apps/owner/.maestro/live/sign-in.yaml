# Signs the demo owner in on the live stack: sign-up form, emailed code from Mailpit.
appId: host.exp.Exponent
env:
  MAILPIT_URL: http://127.0.0.1:54324
  OWNER_EMAIL: mario@northside.example
---
- launchApp:
    stopApp: true
- openLink: "exp://127.0.0.1:8081"
- extendedWaitUntil:
    visible: "Create your account"
    timeout: 120000
- runScript: clear-mailpit.js
- tapOn: "Your name"
- inputText: "Mario"
- tapOn: "Email"
- inputText: ${OWNER_EMAIL}
- tapOn: "Let's set up your account. It takes about 3 minutes."
- tapOn: "I accept the terms and the privacy policy."
- tapOn: "Send code"
- extendedWaitUntil:
    notVisible: "Create your account"
    timeout: 30000
- runScript: mailpit-code.js
- tapOn: "Verification code"
- inputText: ${output.code}
- tapOn:
    text: "Verify"
    optional: true
- extendedWaitUntil:
    notVisible: "Enter the code"
    timeout: 30000
