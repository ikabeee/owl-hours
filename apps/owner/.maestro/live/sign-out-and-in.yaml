# Signs the current owner out from Settings (skipped when nobody is signed in), then signs
# OWNER_EMAIL in and taps through onboarding.
appId: host.exp.Exponent
---
- openLink: "exp://127.0.0.1:8081/--/settings"
- scrollUntilVisible:
    element: "Sign out"
    timeout: 15000
    optional: true
- tapOn:
    text: "Sign out"
    optional: true
- runFlow: sign-in.yaml
- runFlow: finish-onboarding.yaml
