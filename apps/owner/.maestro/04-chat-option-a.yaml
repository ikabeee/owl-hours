appId: host.exp.Exponent
name: Option A sends the text as written
---
- runFlow:
    file: subflows/open.yaml
    env: { ROUTE: "chat/c_ana", WAIT_FOR: "via Zukki · WhatsApp" }
- runFlow: subflows/dismiss-logbox.yaml
- tapOn: "Message input"
- inputText: "On my way, 12:55"
- pressKey: Enter
- runFlow: subflows/dismiss-logbox.yaml
- extendedWaitUntil:
    visible: ".*sent as written.*"
    timeout: 10000
- takeScreenshot: 04-chat-option-a-sent
