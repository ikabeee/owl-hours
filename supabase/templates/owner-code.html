<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Your Zukki sign-in code</title>
  </head>
  <!-- Owner sign-in code (Magic Link and Confirm signup templates), the email side of the Verify screen.
       Values come from handoff-ui/owner-app/tokens.json (Astryx Neutral + Zukki accent). Email-safe:
       tables and inline styles only, so Gmail, Outlook and Apple Mail render it alike. -->
  <body style="margin:0;padding:0;background-color:#f1f1f1;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f1f1;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border-radius:12px;">
            <tr>
              <td align="center" style="padding:32px 24px 0 24px;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <!-- Verify's owl: 'waiting', frame 0, scale 0.8, clipped (HANDOFF-RN-UI.md section 6). The 60px jump
                     headroom is cropped in zukki-waiting.png itself, since email clients ignore overflow clipping;
                     absolute URL because email clients only load hosted images. -->
                <img src="https://raw.githubusercontent.com/ikabeee/owl-hours/main/supabase/templates/zukki-waiting.png" width="154" height="118" alt="Zukki the owl" style="display:block;border:0;width:154px;height:118px;margin:0 auto;" />
                <p style="margin:8px 0 0 0;font-size:19px;line-height:24px;font-weight:700;color:#0074e2;">Zukki</p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 24px 0 24px;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <h1 style="margin:0 0 8px 0;font-size:26px;line-height:32px;font-weight:600;color:#000000;">Enter the code</h1>
                <p style="margin:0;font-size:16px;line-height:24px;color:#474747;">We sent this 6-digit code to {{ .Email }}. Type it in the Zukki owner app to sign in.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background-color:#f1f1f1;border:1px solid rgba(0,0,0,0.08);border-radius:10px;padding:16px 24px;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:32px;line-height:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:8px;color:#000000;">{{ .Token }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 32px 24px;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#474747;">
                <p style="margin:0;">If you didn't ask for this code, you can ignore this email. Nobody can sign in without it.</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0 0;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#474747;">Zukki connects customers with local businesses on WhatsApp.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
